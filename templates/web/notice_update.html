<!DOCTYPE html>
<html>
{% load static %}
<head>
   <meta charset="utf-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <title>공지사항 수정</title>
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <meta name="description" content="돔고돔락 - 기숙사 통합 관리 시스템" />


   {% include 'web/_theme_css.html' with bootstrap5=True %}

   </head>

<body>
	<div id="page">
{% include 'web/_nav.html' %}

  <div class="container mt-5">
    <h2>공지사항 수정</h2>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-3">
        <label for="title" class="form-label">제목</label>
        <input type="text" class="form-control" id="title" name="title" value="{{ notice.title }}">
      </div>
      <div class="mb-3">
        <label for="content" class="form-label">내용</label>
        <textarea class="form-control" id="content" name="content" rows="6">{{ notice.content }}</textarea>
      </div>
      <div class="mb-3">
        <label for="image" class="form-label">이미지 첨부</label>
        <input type="file" class="form-control" id="image" name="image">
        {% if notice.image %}
          <p class="mt-2">현재 이미지: <br>
            <img src="{{ notice.image.url }}" style="max-width: 300px;" class="img-thumbnail mt-1">
          </p>
        {% endif %}
      </div>
      <div class="text-end">
        <a href="{% url 'web:notice_detail' notice.id %}" class="btn btn-secondary">취소</a>
        <button type="submit" class="btn btn-primary">수정 완료</button>
      </div>
    </form>

  </div>

    </div>
</body>
</html>
