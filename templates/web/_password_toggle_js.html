{% comment %}비밀번호 보기/숨기기 (_password_toggle.html). 누르면 글자를 보여 주고, 버튼 글자와 aria-pressed를 바꾼다.{% endcomment %}
<script>
  document.querySelectorAll('[data-pw-toggle]').forEach(function (button) {
    var input = document.getElementById(button.dataset.pwToggle);
    if (!input) return;
    button.hidden = false;
    button.parentNode.classList.add('has-toggle');
    button.addEventListener('click', function () {
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      button.textContent = show ? '숨기기' : '보기';
      button.setAttribute('aria-pressed', show ? 'true' : 'false');
    });
    // 보낼 때는 다시 가려 둔다 (브라우저가 일반 글자로 기억하지 않게)
    if (input.form) input.form.addEventListener('submit', function () { input.type = 'password'; });
  });
</script>
