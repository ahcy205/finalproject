<!DOCTYPE HTML>
<html>
{% load static %}
	<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>돔고돔락</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="돔고돔락 - 기숙사 통합 관리 시스템" />


	<link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css?family=Roboto+Slab:300,400" rel="stylesheet">

	<!-- Animate.css -->
	<link rel="stylesheet" href="{% static 'css/animate.css' %}">
	<!-- Icomoon Icon Fonts-->
	<link rel="stylesheet" href="{% static 'css/icomoon.css' %}">
	<!-- Bootstrap  -->
	<link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">

	<!-- Magnific Popup -->
	<link rel="stylesheet" href="{% static 'css/magnific-popup.css' %}">

	<!-- Owl Carousel  -->
	<link rel="stylesheet" href="{% static 'css/owl.carousel.min.css' %}">
	<link rel="stylesheet" href="{% static 'css/owl.theme.default.min.css' %}">

	<!-- Flexslider  -->
	<link rel="stylesheet" href="{% static 'css/flexslider.css' %}">

	<!-- Pricing -->
	<link rel="stylesheet" href="{% static 'css/pricing.css' %}">

	<!-- Theme style  -->
	<link rel="stylesheet" href="{% static 'css/style.css' %}">

	<!-- Modernizr JS -->
	<script src="{% static 'js/modernizr-2.6.2.min.js' %}"></script>
	<!-- FOR IE9 below -->
	<!--[if lt IE 9]>
	<script src="{% static 'js/respond.min.js' %}"></script>
	<![endif]-->

	</head>
	<body>

	<div class="fh5co-loader"></div>

	<div id="page">
	{% include 'web/_nav.html' %}


	<div class="container" style="margin-top: 80px; min-height: 80vh;">
	  <div class="row">
		<div class="col-md-8 col-md-offset-2" style="background-color: #fff; padding: 30px; border: 1px solid #ddd; border-radius: 6px;">
		  <h4 class="text-center mb-4">공지사항 글쓰기</h4>

			<form method="POST" enctype="multipart/form-data">
			  {% csrf_token %}
			  <table class="table table-bordered">
				<tr>
				  <th style="width: 20%;">제목</th>
				  <td>
					{{ form.title }}
				  </td>
				</tr>
				<tr>
				  <th>내용</th>
				  <td>
					{{ form.content }}
				  </td>
				</tr>
				<tr>
				  <th>이미지 첨부</th>
				  <td>
					{{ form.image }}
				  </td>
				</tr>
			  </table>
			  <div class="text-right">
				<button type="submit" class="btn btn-primary">등록</button>
				<a href="{% url 'web:notice' %}" class="btn btn-secondary">취소</a>
			  </div>
			</form>

		</div>
	  </div>
	</div>

	<script>
	  function updateCharCount(el, counterId, maxLen) {
		const count = el.value.length;
		document.getElementById(counterId).innerText = count;
	  }
	</script>

	<script>
	  function updateCharCount(el, counterId, maxLen) {
		const count = el.value.length;
		document.getElementById(counterId).innerText = count;
	  }

	  function saveNoticeToLocal() {
		const title = document.querySelector('input[name="username"]').value.trim();
		const content = document.querySelector('textarea[name="request"]').value.trim();
		const file = document.querySelector('input[name="file_upload"]').files[0];

		if (!title || !content) {
		  alert("제목과 내용을 입력하세요.");
		  return;
		}

		const notice = {
		  title: title,
		  content: content,
		  fileName: file ? file.name : '',
		  created_at: new Date().toISOString()
		};

		let notices = JSON.parse(localStorage.getItem("notices") || "[]");
		notices.unshift(notice);  // 최신글 위로
		localStorage.setItem("notices", JSON.stringify(notices));

		window.location.href = "{% url 'web:notice' %}";  // 리스트 페이지로 이동 (URL에 맞게 수정)
	  }
	</script>

		<form method="POST" enctype="multipart/form-data">
			{% csrf_token %}
			<table class="table table-bordered">
				<tr>
					<th>제목</th>
					<td><input type="text" name="title" class="form-control"></td>
				</tr>
				<tr>
					<th>내용</th>
					<td><textarea name="content" class="form-control"></textarea></td>
				</tr>
			</table>
			<div class="text-right">
				<button type="submit" class="btn btn-primary">등록</button>
			</div>
		</form>



	<!-- jQuery -->
	<script src="{% static 'js/jquery.min.js' %}"></script>
	<!-- jQuery Easing -->
	<script src="{% static 'js/jquery.easing.1.3.js' %}"></script>
	<!-- Bootstrap -->
	<script src="{% static 'js/bootstrap.min.js' %}"></script>
	<!-- Waypoints -->
	<script src="{% static 'js/jquery.waypoints.min.js' %}"></script>
	<!-- Stellar Parallax -->
	<script src="{% static 'js/jquery.stellar.min.js' %}"></script>
	<!-- Carousel -->
	<script src="{% static 'js/owl.carousel.min.js' %}"></script>
	<!-- Flexslider -->
	<script src="{% static 'js/jquery.flexslider-min.js' %}"></script>
	<!-- countTo -->
	<script src="{% static 'js/jquery.countTo.js' %}"></script>
	<!-- Magnific Popup -->
	<script src="{% static 'js/jquery.magnific-popup.min.js' %}"></script>
	<script src="{% static 'js/magnific-popup-options.js' %}"></script>
	<!-- Count Down -->
	<script src="{% static 'js/simplyCountdown.js' %}"></script>
	<!-- Main -->
	<script src="{% static 'js/main.js' %}"></script>
	<script>
    var d = new Date(new Date().getTime() + 1000 * 120 * 120 * 2000);

    // default example
    simplyCountdown('.simply-countdown-one', {
        year: d.getFullYear(),
        month: d.getMonth() + 1,
        day: d.getDate()
    });

    //jQuery example
    $('#simply-countdown-losange').simplyCountdown({
        year: d.getFullYear(),
        month: d.getMonth() + 1,
        day: d.getDate(),
        enableUtc: false
    });
	</script>
    </div>
	</body>
</html>
