<!DOCTYPE HTML>
<html>
{% load static %}
   <head>
   <meta charset="utf-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <title>돔고돔락</title>
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <meta name="description" content="돔고돔락 - 기숙사 통합 관리 시스템" />


   {% include 'web/_theme_css.html' %}

   </head>
   <body>

   <div class="fh5co-loader" ></div>

   <div id="page">
   {% include 'web/_nav.html' with active='home' %}

    <div class="container" style="margin-top: 80px; min-height: 80vh;">
      <div class="row">
        <div class="col-md-8 col-md-offset-2" style="background-color: #fff; padding: 30px; border: 1px solid #ddd; border-radius: 6px;">
          <h4 class="text-center mb-4">기숙사 신청하기</h4>
          <form method="POST" class="post-form" id="applyForm">
            {% csrf_token %}
               <table class="table table-bordered">
                <tr>
                  <th style="width: 20%">*이름</th>
                  <td>
                    <input type="text" name="name" maxlength="20" class="form-control" required>
                  </td>
                </tr>
                <tr>
                  <th>*학번</th>
                  <td>
                    <input type="text" name="student_number" maxlength="10" class="form-control" required>
                  </td>
                </tr>
                <tr>
                  <th>*성별</th>
                  <td>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="gender" id="gender_male" value="male" required>
                      <label class="form-check-label" for="gender_male">남성</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="gender" id="gender_female" value="female" required>
                      <label class="form-check-label" for="gender_female">여성</label>
                    </div>
                  </td>
                </tr>
                <tr>
                  <th>요청사항</th>
                  <td>
                    <textarea name="content" maxlength="100" class="form-control" rows="4"></textarea>
                  </td>
                </tr>
              </table>
            <div class="text-end mt-3">
              <button type="submit" class="btn btn-primary">신청하기</button>
            </div>
          </form>
            <div class="text-end mt-3">
              <a href="{% url 'web:dorminfo' %}" class="btn btn-danger">신청현황</a>
            </div>
        </div>
      </div>
    </div>



<script>
  function updateCharCount(input, spanId, max) {
    document.getElementById(spanId).innerText = input.value.length;
  }
</script>

   <!-- jQuery -->
   {% include 'web/_theme_js.html' %}
   <script>
    var d = new Date(new Date().getTime() + 1000 * 120 * 120 * 2000);

    // default example
    simplyCountdown('.simply-countdown-one', {
        year: d.getFullYear(),
        month: d.getMonth() + 1,
        day: d.getDate()
    });

    //jQuery example
    $('#simply-countdown-losange').simplyCountdown({
        year: d.getFullYear(),
        month: d.getMonth() + 1,
        day: d.getDate(),
        enableUtc: false
    });
   </script>
   <script>
     document.getElementById("applyForm").addEventListener("submit", function(event) {
      event.preventDefault();
       alert("신청이 완료되었습니다.");
       this.submit();
     });
   </script>
    </div>
   </body>
</html>
