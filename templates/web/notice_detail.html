<!DOCTYPE html>
<html>
{% load static %}
<head>
   <meta charset="utf-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <title>공지사항 상세보기</title>
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <meta name="description" content="돔고돔락 - 기숙사 통합 관리 시스템" />


   <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700" rel="stylesheet">
   <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:300,400" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


   <!-- Animate.css -->
   <link rel="stylesheet" href="{% static 'css/animate.css' %}">
   <!-- Icomoon Icon Fonts-->
   <link rel="stylesheet" href="{% static 'css/icomoon.css' %}">
   <!-- Bootstrap  -->
   <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">


   <!-- Magnific Popup -->
   <link rel="stylesheet" href="{% static 'css/magnific-popup.css' %}">

   <!-- Owl Carousel  -->
   <link rel="stylesheet" href="{% static 'css/owl.carousel.min.css' %}">
   <link rel="stylesheet" href="{% static 'css/owl.theme.default.min.css' %}">

   <!-- Flexslider  -->
   <link rel="stylesheet" href="{% static 'css/flexslider.css' %}">

   <!-- Pricing -->
   <link rel="stylesheet" href="{% static 'css/pricing.css' %}">

   <!-- Theme style  -->
   <link rel="stylesheet" href="{% static 'css/style.css' %}">

   <!-- Modernizr JS -->
   <script src="{% static 'js/modernizr-2.6.2.min.js' %}"></script>
   <!-- FOR IE9 below -->
   <!--[if lt IE 9]>
   <script src="{% static 'js/respond.min.js' %}"></script>
   <![endif]-->

   </head>

<body>
	<div id="page">
{% include 'web/_nav.html' %}

    <div class="container mt-5">
        <div class="bg-secondary bg-opacity-10 p-4 rounded shadow-sm">
            <h2 class="mb-3">제목: {{ notice.title }}</h2>
            <p class="text-muted text-end mb-3"><strong>작성일:</strong> {{ notice.date }}</p>
            <hr class="my-4 border-dark">
            <div class="mb-4">
                { 내용 } {{ notice.content|linebreaks }}
            </div>

            {% if notice.image %}
            <hr class="my-4">
            <div class="text-center mt-3">
                <img src="{{ notice.image.url }}" alt="공지 이미지" class="img-fluid" style="max-width: 100%; height: auto;">
            </div>
            {% endif %}

            <hr class="my-4">
            <div class="text-end mt-4">
                <a href="{% url 'web:notice' %}" class="btn btn-secondary">목록으로</a>
                {% if user.is_staff %}
                <a href="{% url 'web:notice_update' notice.id %}" class="btn btn-primary ms-2">수정하기</a>
                {% endif %}
            </div>
        </div>
    </div>

</div>
</body>
</html>
