<!DOCTYPE html>
<html>
{% load static %}
<head>
   <meta charset="utf-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <title>공지사항 상세보기</title>
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <meta name="description" content="돔고돔락 - 기숙사 통합 관리 시스템" />


   {% include 'web/_theme_css.html' with bootstrap5=True %}

   </head>

<body>
	<div id="page">
{% include 'web/_nav.html' %}

    <div class="container mt-5">
        <div class="bg-secondary bg-opacity-10 p-4 rounded shadow-sm">
            <h2 class="mb-3">제목: {{ notice.title }}</h2>
            <p class="text-muted text-end mb-3"><strong>작성일:</strong> {{ notice.date }}</p>
            <hr class="my-4 border-dark">
            <div class="mb-4">
                { 내용 } {{ notice.content|linebreaks }}
            </div>

            {% if notice.image %}
            <hr class="my-4">
            <div class="text-center mt-3">
                <img src="{{ notice.image.url }}" alt="공지 이미지" class="img-fluid" style="max-width: 100%; height: auto;">
            </div>
            {% endif %}

            <hr class="my-4">
            <div class="text-end mt-4">
                <a href="{% url 'web:notice' %}" class="btn btn-secondary">목록으로</a>
                {% if user.is_staff %}
                <a href="{% url 'web:notice_update' notice.id %}" class="btn btn-primary ms-2">수정하기</a>
                {% endif %}
            </div>
        </div>
    </div>

</div>
</body>
</html>
