<!DOCTYPE HTML>
<html>
{% load static %}
	<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>돔고돔락</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="돔고돔락 - 기숙사 통합 관리 시스템" />


	{% include 'web/_theme_css.html' %}

	</head>
	<body>
		
	<div class="fh5co-loader"></div>
	
	<div id="page">
	{% include 'web/_nav.html' with active='guide' %}
	
	<aside id="fh5co-hero">
		<div class="flexslider">
			<ul class="slides">
		   	<li style="background-image: url({% static 'images/img_bg_2.jpg' %});">
		   		<div class="overlay-gradient"></div>
		   		<div class="container">
		   			<div class="row">
			   			<div class="col-md-8 col-md-offset-2 text-center slider-text">
			   				<div class="slider-text-inner">
			   					<h1 class="heading-section">생활관 안내</h1>
			   				</div>
			   			</div>
			   		</div>
		   		</div>
		   	</li>
		  	</ul>
	  	</div>
	</aside>

	<div id="fh5co-course-categories">
		<div class="container">
			<div class="row">
				<div class="col-md-3 col-sm-7 text-center animate-box">
					<div class="services">
					  					  <a href="{% url 'web:check_in' %}">
						 <span class="icon">
							<i class="icon-home-outline"></i>
						 </span>
						 <div class="desc">
							<h3>
							   기숙사 신청
							</h3>
						 </div>
					  </a>
					  
				   </div>
				</div>
				<div class="col-md-3 col-sm-7 text-center animate-box">
					<div class="services">
					  					  <a href="{% url 'web:outside' %}">
						 <span class="icon">
							<i class="icon-calender-outline"></i>
						 </span>
						 <div class="desc">
							<h3>
							   외박 신청
							</h3>
						 </div>
					  </a>
					  
				   </div>
				</div>
				<div class="col-md-3 col-sm-7 text-center animate-box">
					<div class="services">
						<a href="{% url 'web:info' %}">
							<span class="icon">
								<i class="icon-info-large"></i>
							</span>
							<div class="desc">
								<h3>생활관 안내</h3>
							</div>
						</a>
					</div>
				</div>
				<div class="col-md-3 col-sm-7 text-center animate-box">
					<div class="services">
						<a href="{% url 'web:rules' %}">
							<span class="icon">
								<i class="icon-file"></i>
							</span>
							<div class="desc">
								<h3>생활관 규칙</h3>
							</div>
						</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	<footer id="fh5co-footer" role="contentinfo" style="background-image: url({% static 'images/img_bg_4.jpg' %});">
		<div class="overlay"></div>
		<div class="container">
			<div class="row copyright">
				<div class="col-md-12 text-center">
					<p>
						<small class="block">&copy; DORM苦DORM樂</small>
						<small class="block">Designed by team - 도미를 찾아서</small>
					</p>
				</div>
			</div>
		</div>
	</footer>
	</div>
	<div class="gototop js-top">
		<a href="#" class="js-gotop"><i class="icon-arrow-up"></i></a>
	</div>
	
	<!-- jQuery -->
	{% include 'web/_theme_js.html' %}
	<script>
    var d = new Date(new Date().getTime() + 1000 * 120 * 120 * 2000);

    // default example
    simplyCountdown('.simply-countdown-one', {
        year: d.getFullYear(),
        month: d.getMonth() + 1,
        day: d.getDate()
    });

    //jQuery example
    $('#simply-countdown-losange').simplyCountdown({
        year: d.getFullYear(),
        month: d.getMonth() + 1,
        day: d.getDate(),
        enableUtc: false
    });
	</script>
	</body>
</html>
