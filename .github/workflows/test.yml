name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # 로컬 docker-compose.yml과 같은 PostgreSQL + pgvector 이미지 (ADR 0005)
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_DB: dorm
          POSTGRES_USER: dorm
          POSTGRES_PASSWORD: dorm-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dorm -d dorm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_DB: dorm
      POSTGRES_USER: dorm
      POSTGRES_PASSWORD: dorm-ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Validate API docs (OpenAPI schema)
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml

      - name: Run tests
        run: python manage.py test web dorm knowledge
