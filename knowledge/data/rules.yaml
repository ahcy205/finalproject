# 생활관 규칙. 화면(/rules/)과 RAG 검색이 함께 쓰는 원본 데이터입니다.
# 문구를 고치면 화면에 바로 반영되고, 검색 자료는 색인을 다시 만들 때 반영됩니다.
page: rules
url: /rules/
title: 생활관 규칙
sections:
- title: null
  articles:
  - title: 제1조 (목적)
    number: '1'
    lines:
    - 이 수칙은 생활관 운영규정 제7조에 의거 생활관 입관자(이하 "관생"이라 한다)가 지켜야 할 생활규범을 정함을 목적으로 한다.
  - title: 제2조 (적용범위)
    number: '2'
    lines:
    - 이 생활관 생활수칙(이하 "수칙"이라 한다)은 모든 관생에게 적용한다.
  - title: 제3조 (생활규범)
    number: '3'
    lines:
    - 관생의 생활관내 출입시간은 06:00-23:00로 한다. 다만, 부득이한 경우라고 판단될 경우에는 생활관장은 출입시간을 변경할 수 있다.
    - 방(침실)의 천정등은 00:00-06:00까지 소등함을 원칙으로 하되, 실원 전원의 합의하에 점등할 수 있다.
  - title: 제4조 (의무사항)
    number: '4'
    lines:
    - 관생은 생활수칙과 공중도덕을 준수하여야 한다.
    - 관생은 건전한 공동생활과 면학분위기가 유지될 수 있도록 생활하여야 한다.
    - 생활관내에서는 절대 정숙하여야 하며 타인에게 피해를 주는 행위를 하여서는 아니 된다.
    - 관생은 각 실내를 청소 정리 정돈하고 청결하게 유지하여야 한다.
    - 관생은 실내 화기단속 등 화재예방과 기타 안전사고에 대한 책임을 져야 한다.
    - 관생은 생활관 시설을 보호 유지하고 관리, 보존하여야 한다.
    - 방을 비울 시에는 반드시 문을 잠그고 도난방지에 유의하여야 한다.
    - 관생은 관계직원의 정당한 지시에 순응하여야 하며 점검 및 대청소에 적극 협조하여야 한다.
  - title: 제5조 (출입제한)
    number: '5'
    lines:
    - 남, 여학생은 사용이 따로 구분되어 있는 제반시설을 상호출입할 수 없으며, 부득이한 경우에는 생활관 직원의 사전허가를 받아야 한다.
    - 사용자의 승인 없이 타인의 방에 출입할 수 없으며, 타인의 방에서 숙박할 수 없다.
  - title: 제6조 (공용물 사용)
    number: '6'
    lines:
    - 생활관내의 모든 기물은 임의로 이동할 수 없으며, 특히 공용물품을 임의로 이동하거나 독점 사용하여서는 안 된다.
    - 전화사용료 등의 개인사용료는 본인이 부담하여야 한다.
    - 세탁은 지정된 세탁실을 이용하여야 하며 23:00시부터 익일 07:00시까지는 세탁할 수 없다.
    - 세탁물의 건조는 건조기 또는 지정된 건조대를 이용하여야 한다.
    - 다리미실을 이용할 때에는 화재에 특히 유의하여야 하며 사용 후에는 반드시 전원을 제거한 후 정돈하여야 한다.
  - title: 제7조 (변상책임)
    number: '7'
    lines:
    - 관생이 고의 또는 과실로 생활관의 시설과, 대여받은 물품을 훼손하였거나 망실하였을 때에는 이를 변상하여야 한다.
  - title: 제8조 (광고 및 게시)
    number: '8'
    lines:
    - 광고 및 게시물은 반드시 지정된 게시판을 이용하여야 한다.
    - 모든 게시물은 48시간이 경과하면 주지 된 것으로 보고 철거할 수 있다.
  - title: 제9조 (통보의무)
    number: '9'
    lines:
    - 관생은 다음 각호의 사항이 발생하였을 때에는 지체없이 이를 관계 부서에 통보하여야 한다.
    - '- 시설, 물품 등을 훼손하였거나 망실하였을 때'
    - '- 화재, 도난, 응급환자, 기타 이변이 발생하였을 때'
    - '- 전기, 수도, 스팀 등의 고장이나 시설, 물품 등의 파손을 발견하였을 때'
    - '- 기타 위의 각 호에 준하는 사태가 발생하였을 때'
  - title: 제10조 (금지사항)
    number: '10'
    lines:
    - 다음 각호의 행위를 한 관생은 상담을 통하여 퇴관 여부를 결정하되, 금지사항 위반에 따른 벌점내역은 별표1에 의한다.
    - 1. 생활관 사용권의 양도, 외부인의 숙박, 기타 이와 유사한 행위
    - 2. 시설 및 대여 물품의 임의 이동, 원형 변경 및 목적외 사용
    - 3. 공동 사용 물품의 독점 또는 임의 이동
    - 4. 건물 내 위험물의 반입 및 사용
    - 5. 타인에게 방해가 되는 소음, 음주, 고성방가
    - 6. 도박
    - 7. 동물 사육
    - 8. 영리 목적의 행위
    - 9. 전열기, 기타 난방/취사 도구 사용
    - 10. 비밀결사 조직
    - 11. 열쇠 개인 제작
    - 12. 질서를 문란케 하거나 학생 신분에 위배되는 행위
  - title: 제11조 (관리)
    number: '11'
    lines:
    - 관생은 각자의 방을 항상 청결하게 유지하여야 하며 시설물 보호에 노력하여야 한다.
    - 관생은 쾌적한 생활 환경 유지를 위하여 매주 수요일 22:00 ~ 23:00에 대청소를 실시한다.
  - title: 제12조 (점검)
    number: '12'
    lines:
    - 생활관 문화 형성과 복지향상 자료를 수집하고 차년도 생활관비 및 기초자료를 작성하기 위하여 인원, 시설, 위생, 생활상태 등을 점검한다.
    - 정기점검은 매주 수요일 저녁에 실시하고 특별한 사유가 있을 때에는 특별점검을 실시할 수 있다.
    - 점검은 생활관장과 생활감 또는 직원이 원칙이나 자치회에 위임할 수 있다.
  - title: 제13조 (퇴관원서 제출)
    number: '13'
    lines:
    - 입관자가 퇴관할 때에는 퇴관확인서를 제출하고 대여받은 물품은 반환하여야 한다.
  - title: 제14조 (포상)
    number: '14'
    lines:
    - 생활관장은 면학여건 조성 및 환경개선에 기여한 학생에 대하여 포상할 수 있다.
  - title: 제14조의2 (벌점감면)
    number: 14-2
    lines:
    - 생활관장은 제10조에 의하여 벌점 받은 관생들에게 별표1 제2항에 따라 벌점 감면 혜택을 부여할 수 있다.
  - title: 제15조 (징계)
    number: '15'
    lines:
    - 생활관 규칙 및 수칙을 위반한 관생에 대하여는 별표1에 의거 경고 또는 퇴관의 징계를 할 수 있다.
    - 경고 및 퇴관은 생활관장이 행한다.
  - title: 부칙
    lines:
    - (시행일) 이 수칙은 1995년 3월 1일부터 시행한다.
    - (시행일) 이 수칙은 2002년 5월 15일부터 개정 시행한다.
    - (시행일) 이 수칙은 2006년 12월 18일부터 개정 시행한다. 다만, 위반 시 벌점 및 상점 부과 규정은 2011.08.29부터 적용한다.
    - (시행일) 이 수칙은 2012년 12월 26일부터 시행한다.
