# 학생이 쓰는 말 → 규정에 적힌 말 (검색어 보강)
#
# 학생은 "전기장판"이라고 묻지만 규칙에는 "전열기"라고만 적혀 있어 검색이 놓친다(docs/adr/0009).
# 질문에 왼쪽 말이 있으면 오른쪽 말을 검색어 끝에 덧붙인다. 의미 검색과 키워드 검색 모두에 쓴다.
#
# - 평가 질문에 맞추지 말고, 학생이 실제로 쓸 법한 일상어를 규정 용어로 옮기는 것만 넣는다.
# - 너무 흔한 말("기숙사" 등)은 넣지 않는다. 모든 질문에 붙어 검색을 흐린다.
# - 고친 뒤에는 evaluate_knowledge_search로 전후를 비교한다.

